version: 2

updates:
  # Dependabot does not understand Rush: it edits package.json but not common/config/rush/pnpm-lock.yaml.
  # Before merging, push `rush update` output to the PR branch (see docs/development/release.md).
  - package-ecosystem: "npm"
    directories:
      - "/packages/*"
      - "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      toolchain:
        patterns:
          - "oxfmt"
          - "oxlint"
          - "oxlint-tsgolint"
          - "typescript"
          - "vitest"
          - "@types/node"
    ignore:
      # Runtime types follow the Node LTS major pinned in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
