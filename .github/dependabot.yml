version: 2

updates:
  # Dependabot does not understand Rush: it edits package.json but not common/config/rush/pnpm-lock.yaml, and
  # ensureConsistentVersions needs a dependency moved in every package at once. One group collects every npm update
  # into a single weekly PR; push `rush update` output to its branch before merging (see docs/development/release.md).
  # The cooldown keeps proposals past the minimum release age in common/config/rush/pnpm-config.json.
  - package-ecosystem: "npm"
    directories:
      - "/packages/*"
      - "/infra/architecture"
      - "/tests/smoke"
      - "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Runtime types follow the Node LTS major pinned in .node-version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # lint-config is a git dependency whose upgrades land with their code fixes; Dependabot misreads its tags and
      # proposes downgrades (v0.5.0 -> v0.3.2).
      - dependency-name: "@perfectpan/lint-config"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
