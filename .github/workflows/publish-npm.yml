# npm Trusted Publishing for both public packages is registered against this file name; renaming it requires
# changing each package's trusted publisher on npmjs.com first. The release jobs come from the shared workflow in
# PerfectPan/gh-repo-checks; docs/development/release.md describes how this repository uses it.
name: Release

on:
  push:
    branches: [main]
  # Rebuilds the version pull request from the current main, or retries a failed publish.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: PerfectPan/gh-repo-checks/.github/workflows/npm-release.yml@v1
    # The shared workflow narrows these per job; only its publish job can request an OIDC token.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      # The website apps under apps/ never reach npm, so their advisories do not block a package release.
      audit-command: pnpm --filter '!./apps/**' audit --prod --audit-level=high
