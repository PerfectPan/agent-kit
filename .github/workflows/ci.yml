name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm from `packageManager` and the Node.js range from `devEngines.runtime`, then runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      # Rejects a pending record that names a private package, which is never consumed, or that would move the 0.x
      # packages to 1.0.0 without `allow-major` in .github/repo-checks.conf.
      - uses: PerfectPan/gh-repo-checks@v1
        with:
          check: release-plan
      - run: pnpm run check

  # Session reading on Windows, where `\` is a path separator: the sessions context, every provider, the conformance
  # suites and the shell's path and detection cases. The aggregate gate stays on Linux; the other packages' Windows
  # failures (process locks, hook installation, the architecture tooling) are tracked on their own.
  # --no-bail and --no-sort report every package, including the dependents of one that failed.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node
          require-lockfile: true
          cache: true
      # The shell's tests import its built entries, as in the aggregate gate, which builds before it tests.
      - run: pnpm --filter @rivus/agent-kit... run build
      - run: >-
          pnpm -r --no-bail --no-sort
          --filter @rivus/agent-kit-sessions --filter @rivus/agent-kit-catalog --filter @rivus/agent-kit-testing
          --filter './packages/providers/*' test
      - run: pnpm --filter @rivus/agent-kit exec vp test run test/windows-paths.test.ts test/session-detection.test.ts
