name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm from `packageManager` and the Node.js major from .node-version, then runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      - run: pnpm run check
