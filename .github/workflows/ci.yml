name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm from `packageManager` and the Node.js range from `devEngines.runtime`, then runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          runtime: node
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      # Rejects a pending record that names a private package, which is never consumed, or that would move the 0.x
      # packages to 1.0.0 without `allow-major` in .github/repo-checks.conf.
      - uses: PerfectPan/gh-repo-checks@v1
        with:
          check: release-plan
      - run: pnpm run check
