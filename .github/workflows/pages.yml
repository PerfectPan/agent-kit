name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # This workflow is not a required check (CI remains unfiltered). Skip unrelated PRs before
    # installing dependencies; package changes also affect generated reference pages and facts.
    paths:
      - apps/website/**
      - apps/website-api/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages*.yml
      - scripts/pages-preview.ts
      - scripts/lib/pages-*.ts
      - package.json
      - .node-version
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only PR builds cancel. Every branch writer also holds the shared pages-gh-pages job lock.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/agent-kit/pr-preview/pr-{0}', github.event.pull_request.number) || '/agent-kit' }}
      SITE_PREVIEW_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the pnpm from `packageManager` and the Node.js major from .node-version, then runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      - name: Check deployment data handling
        run: pnpm --filter repo-scripts test
      # `website...` is the site and its workspace dependencies, including both published packages.
      # Those builds run first. The site build then generates the API reference through website-api.
      - run: pnpm --filter website... run build
      - name: static navigation
        env:
          # google-chrome ships on the ubuntu-latest image. The script falls back to this path on Linux.
          CHROME: /usr/bin/google-chrome
        run: node apps/website/scripts/static-nav-check.mjs
      - name: Package static site and build identity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pages-artifact"
          cp -R apps/website/dist/client "$RUNNER_TEMP/pages-artifact/site"
          # Jekyll must preserve __tsr and asset names starting with underscores.
          : > "$RUNNER_TEMP/pages-artifact/site/.nojekyll"
          jq -n --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" \
            '{pr_number: $pr_number, head_sha: $head_sha}' > "$RUNNER_TEMP/pages-artifact/metadata.json"
      - uses: actions/upload-artifact@v7
        with:
          name: pages-site
          path: ${{ runner.temp }}/pages-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  deploy:
    name: deploy
    needs: build
    # A pull request and workflow_dispatch only build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # Download the static artifact from the build job.
      pages: write # Request a Pages build after updating the publishing branch.
    concurrency:
      group: pages-gh-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: https://perfectpan.github.io/agent-kit/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Publish production files, preserving pr-preview
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          node scripts/pages-preview.ts main
