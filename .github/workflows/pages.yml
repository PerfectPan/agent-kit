name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # This workflow is not a required check (CI remains unfiltered). Skip unrelated PRs before
    # installing dependencies; package changes also affect generated reference pages and facts.
    paths:
      - apps/website/**
      - apps/website-api/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
      - package.json
      - .node-version
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only PR builds cancel. Main deployments also hold the shared pages-deploy job lock.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE_BASE_PATH: /agent-kit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the pnpm from `packageManager` and the Node.js major from .node-version, then runs
      # `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          require-lockfile: true
          # The store cache is keyed on the lockfile content hash; the action restores before installing.
          cache: true
      # `website...` is the site and its workspace dependencies, including both published packages.
      # Those builds run first. The site build then generates the API reference through website-api.
      - run: pnpm --filter website... run build
      - name: static navigation
        env:
          # google-chrome ships on the ubuntu-latest image. The script falls back to this path on Linux.
          CHROME: /usr/bin/google-chrome
        run: node apps/website/scripts/static-nav-check.mjs
      # Pages serves an Actions artifact as is (no Jekyll), so asset names starting with "_" survive.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/website/dist/client
          retention-days: 3

  deploy:
    name: deploy
    needs: build
    # Pull requests only build. A push to main, or a manual run on main, deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
