name: Pages preview

on:
  workflow_run:
    workflows: [Pages]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  preview:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read # Download the static artifact from the triggering workflow run.
      pages: write # Request a Pages build after updating the publishing branch.
    concurrency:
      group: pages-gh-pages
      cancel-in-progress: false
      queue: max
    steps:
      # workflow_run must already exist on the default branch. Only its trusted helper runs here;
      # neither the PR checkout nor an artifact-supplied executable ever runs with this token.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate artifact, publish preview, and update comment
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          node scripts/pages-preview.ts preview

  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      pages: write # Request a Pages build after updating the publishing branch.
    concurrency:
      group: pages-gh-pages
      cancel-in-progress: false
      queue: max
    steps:
      # Never use the PR ref: a close event can originate in an untrusted fork.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            /scripts/
            /.node-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Remove preview and update existing comment
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          node scripts/pages-preview.ts cleanup
