name: Version Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the lockstep policy (policy uses its nextBump when left as "policy")
        required: true
        default: policy
        type: choice
        options: [policy, patch, minor, major]

permissions: {}

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  decide:
    name: decide release state
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: state
        run: node scripts/release-state.ts >> "$GITHUB_OUTPUT"

  version:
    name: prepare version pull request
    needs: decide
    if: needs.decide.outputs.state == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node common/scripts/install-run-rush.js install
      - name: Set a Git identity for rush version
        # rush version reads git config user.email and fails without it. The release PR commit itself is created and
        # signed through the GitHub API by create-pull-request, so this identity does not appear on it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump versions and write changelogs with Rush
        env:
          BUMP: ${{ inputs.bump || 'policy' }}
        run: |
          if [[ "$BUMP" == "policy" ]]; then
            npm run version-packages
          else
            node common/scripts/install-run-rush.js version --bump --version-policy main --override-bump "$BUMP"
            node common/scripts/install-run-rush.js update
          fi
      - name: Run release gates on the bumped versions
        # A pull request opened with GITHUB_TOKEN starts no CI, so this job verifies its content before opening it.
        run: npm run check
      - name: Confirm main has not moved on
        # A re-run keeps its original commit. Once main has moved on, the newer push's run owns the release PR, and
        # updating it from this commit would drop the newer change files.
        id: fresh
        # pipefail: a failed remote query must fail the run instead of reading as "main moved on".
        shell: bash
        run: |
          main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ -n "$main" ]]
          if [[ "$main" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main, not $GITHUB_SHA; leaving the release PR to the newer run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the version pull request
        if: steps.fresh.outputs.current == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: rush-release/main
          base: main
          sign-commits: true
          commit-message: "chore(release): version packages"
          title: "chore(release): version packages"
          draft: always-true
          body: |
            Coordinated Rush release prepared by the Version Packages workflow, which ran `npm run check` on this
            content. Every push to `main` with pending change files regenerates this PR.

            Pull requests created with the workflow token do not start CI. Review the version and changelog diff,
            select **Ready for review** to run CI, then squash-merge. The merge tags the release, creates the
            GitHub Release and publishes to npm from `publish-npm.yml`.
