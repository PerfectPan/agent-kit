name: Version Packages

on:
  push:
    branches: [main]
  # Rebuilds the release PR from the current main, for example after it was closed by hand.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: version-packages
  cancel-in-progress: false

jobs:
  decide:
    name: decide release state
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - uses: actions/checkout@v7
      # release-state.ts asks pnpm for the workspace packages and the versioning.fixed group; it needs no
      # dependencies, so this job installs none.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          install: false
      - id: state
        run: node scripts/release-state.ts >> "$GITHUB_OUTPUT"

  version:
    name: prepare version pull request
    needs: decide
    if: needs.decide.outputs.state == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog links and the release branch need full history.
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          require-lockfile: true
      - name: Confirm main has not moved on
        # A re-run keeps its original commit. Once main has moved on, the newer push's run owns the release PR, and
        # updating it from this commit would drop the newer changesets.
        id: fresh
        # pipefail: a failed remote query must fail the run instead of reading as "main moved on".
        shell: bash
        run: |
          main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          [[ -n "$main" ]]
          if [[ "$main" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main, not $GITHUB_SHA; leaving the release PR to the newer run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # Runs the version script `release:version`: `pnpm version -r` bumps the versioning.fixed group to one shared
      # version (the largest bump across the pending changesets), writes each package's CHANGELOG.md and deletes the
      # consumed changesets, then `pnpm run check` runs the release gates on the bumped tree. A pull request opened
      # with github.token starts no CI until it is marked ready for review, so the gates run here. The action runs
      # the script before it pushes anything, so a failing gate fails the run and leaves the release PR as it was.
      # Otherwise the action commits through the GitHub API (signed) and opens or updates the draft PR
      # `changeset-release/main` -> `main`, whose body lists each package's new changelog section. That commit takes
      # every change in the checkout that .gitignore does not exclude, so the gates must write only ignored files.
      - name: Create or update the version pull request
        if: steps.fresh.outputs.current == 'true'
        uses: changesets/action@v2
        with:
          # The action runs this command without a shell, so the `&&` between the bump and the gates lives in the
          # root package.json script.
          version-script: pnpm run release:version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          pr-draft: always
          # The token goes through the input, not the GITHUB_TOKEN environment variable: the action fails when the
          # env var and the input disagree, which would break a later switch to an App token or PAT.
          github-token: ${{ github.token }}
