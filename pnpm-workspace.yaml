packages:
  - packages/*
  - packages/providers/*
  - infra/*
  - tests/*
  - scripts

# Versions shared by workspace packages are declared once here and referenced with "catalog:". Packing replaces
# "catalog:" with the range below, so a published manifest carries the range written here.
# catalogMode: strict only polices `pnpm add`: adding a package that is already cataloged at a version outside
# the catalog fails the install. It does not police hand-edited package.json files or dependencies the catalog
# does not declare — those install fine, so keep shared versions in the catalog deliberately.
catalogMode: strict
catalog:
  '@agentclientprotocol/sdk': 1.8.0
  '@arethetypeswrong/cli': 0.18.5
  '@decimalturn/toml-patch': ^3.3.0
  '@effect/tsgo': 0.52.0
  '@effect/vitest': 4.0.3
  '@perfectpan/lint-config': github:PerfectPan/lint-config#v0.6.0
  '@size-limit/preset-small-lib': 14.1.0
  '@types/node': 24.19.2
  effect: 4.0.4
  es-toolkit: ^1.52.0
  jsonc-parser: ^3.3.1
  oxc-parser: 0.154.0
  publint: 0.3.25
  shell-quote: ^1.12.0
  size-limit: 14.1.0
  typescript: 7.0.2
  # Toolchain upgrade procedure: docs/development/release.md#bot-pull-requests.
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4
  zod: ^4.6.7

# Redirect whatever declares a `vite` range to the vite-plus core alias.
overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite

# Reject versions published less than a day ago, in minutes.
minimumReleaseAge: 1440

strictPeerDependencies: true
autoInstallPeers: true

allowBuilds:
  # Its postinstall verifies the platform binary that the bundled vite runs.
  esbuild: true
  # Under eslint-import-resolver-typescript (the boundary lint's resolver). Its native binding arrives as an
  # optional dependency; the postinstall only re-checks that binding, so it does not need to run.
  unrs-resolver: false

versioning:
  # `pnpm version -r` must delete consumed changesets and write each package's CHANGELOG.md immediately.
  # The default ("registry") keeps changesets until the registry confirms publication, which would keep the
  # Version Packages pull request open forever because the changesets action decides from the remaining files.
  changelog:
    storage: repository
  # All published packages release in lockstep at one shared version: `pnpm version -r` bumps the whole group
  # together and one release tag covers it. scripts/release-state.ts reads the tag from this group's version,
  # and scripts/check-release.ts verifies it. Add every new published package to the group.
  fixed:
    - ['@rivus/agent-kit', '@rivus/agent-kit-collab']
